<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StudentHelper</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f4f6fb;
      color: #1d2433;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 24px 16px;
    }
    .wrap { width: 100%; max-width: 760px; display: flex; flex-direction: column; gap: 20px; }
    header { display: flex; align-items: center; gap: 14px; }
    .logo {
      width: 48px; height: 48px; border-radius: 12px;
      background: #4f6ef7; color: #fff; font-weight: 700; font-size: 18px;
      display: grid; place-items: center;
    }
    header h1 { font-size: 24px; }
    header p { color: #5b6478; font-size: 14px; }
    h2 { font-size: 18px; font-weight: 600; }

    .subjects { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
    .subjects button {
      padding: 14px; border-radius: 12px; border: 2px solid #dde2ee;
      background: #fff; font-size: 15px; cursor: pointer; transition: all .15s;
    }
    .subjects button:hover { border-color: #4f6ef7; }
    .subjects button.active { border-color: #4f6ef7; background: #eef1ff; font-weight: 600; }

    .chat {
      background: #fff; border-radius: 16px; border: 1px solid #dde2ee;
      display: flex; flex-direction: column; height: 520px; overflow: hidden;
    }
    .status { padding: 12px 16px; font-size: 13px; color: #5b6478; border-bottom: 1px solid #eef0f5; }
    .status .dot { color: #22a861; }
    .status.busy .dot { color: #e5a00d; }

    #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 85%; padding: 10px 14px; border-radius: 14px; line-height: 1.45; white-space: pre-wrap; word-wrap: break-word; font-size: 15px; }
    .msg.user { align-self: flex-end; background: #4f6ef7; color: #fff; border-bottom-right-radius: 4px; }
    .msg.bot { align-self: flex-start; background: #f1f3f8; border-bottom-left-radius: 4px; }
    .msg.error { align-self: center; background: #fdecec; color: #a12626; font-size: 14px; }
    .hint { color: #8a92a6; text-align: center; margin: auto; font-size: 14px; }

    .input-row { display: flex; gap: 8px; padding: 12px; border-top: 1px solid #eef0f5; }
    #question {
      flex: 1; resize: none; padding: 10px 12px; border-radius: 10px;
      border: 1px solid #dde2ee; font: inherit; font-size: 15px; height: 46px;
    }
    #question:focus { outline: none; border-color: #4f6ef7; }
    #question:disabled { background: #f6f7fa; }
    #send {
      padding: 0 20px; border: none; border-radius: 10px; background: #4f6ef7;
      color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
    }
    #send:disabled { background: #b8c3f5; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="logo">SH</div>
      <div>
        <h1>StudentHelper</h1>
        <p>Your personal study assistant</p>
      </div>
    </header>

    <h2>What would you like to learn today?</h2>
    <div id="subjects" class="subjects">
      <button type="button" data-subject="Math">📐 Math</button>
      <button type="button" data-subject="Science">🔬 Science</button>
      <button type="button" data-subject="English">📚 English</button>
      <button type="button" data-subject="Social Studies">🌎 Social Studies</button>
    </div>

    <div class="chat">
      <div id="status" class="status"><span class="dot">●</span> <span id="statusText">Pick a subject to start</span></div>
      <div id="log"><p class="hint">Choose a subject above, then type your question below.</p></div>
      <div class="input-row">
        <textarea id="question" placeholder="Pick a subject first…" disabled></textarea>
        <button id="send" type="button" disabled>Send</button>
      </div>
    </div>
  </div>

  <script>
    const subjectButtons = document.querySelectorAll("#subjects button");
    const log = document.getElementById("log");
    const input = document.getElementById("question");
    const sendBtn = document.getElementById("send");
    const status = document.getElementById("status");
    const statusText = document.getElementById("statusText");

    let subject = null;
    let history = [];   // { role: "user" | "assistant", content: string }
    let busy = false;

    function setStatus(text, isBusy) {
      statusText.textContent = text;
      status.classList.toggle("busy", !!isBusy);
    }

    function addMessage(text, type) {
      const hint = log.querySelector(".hint");
      if (hint) hint.remove();
      const div = document.createElement("div");
      div.className = "msg " + type;
      div.textContent = text;          // textContent keeps user text safe
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
      return div;
    }

    function updateControls() {
      input.disabled = !subject || busy;
      sendBtn.disabled = !subject || busy || input.value.trim() === "";
    }

    // Subject selection
    subjectButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        subjectButtons.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        const changed = subject !== btn.dataset.subject;
        subject = btn.dataset.subject;
        if (changed) {
          history = [];
          log.innerHTML = "";
          addMessage("Hi! Ask me anything about " + subject + ".", "bot");
        }
        input.placeholder = "Ask a " + subject + " question…";
        setStatus("Ready to help with " + subject);
        updateControls();
        input.focus();
      });
    });

    input.addEventListener("input", updateControls);

    // Enter sends, Shift+Enter makes a new line
    input.addEventListener("keydown", e => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });
    sendBtn.addEventListener("click", send);

    async function send() {
      const text = input.value.trim();
      if (!text || !subject || busy) return;

      addMessage(text, "user");
      history.push({ role: "user", content: text });
      input.value = "";
      busy = true;
      updateControls();
      setStatus("Thinking…", true);
      const thinking = addMessage("…", "bot");

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ subject, messages: history })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Server error " + res.status);

        thinking.textContent = data.reply;
        history.push({ role: "assistant", content: data.reply });
        setStatus("Ready to help with " + subject);
      } catch (err) {
        thinking.remove();
        history.pop(); // drop the unanswered question so the chat stays valid
        addMessage("Sorry, something went wrong: " + err.message, "error");
        setStatus("Error – try again", true);
      } finally {
        busy = false;
        updateControls();
        input.focus();
      }
    }
  </script>
</body>
</html>
